name: backend

# Builds and tests the .NET solution, and fails if the EF Core model has drifted away from
# the migrations.
#
# Deliberately standalone and narrow, matching design.yml, so it is useful before the full CI
# pipeline lands in issue #7. That issue should absorb this file rather than sit alongside it.

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/ef.sh'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]

jobs:
  build-and-test:
    name: build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: backend
        run: dotnet restore TripsAgent.slnx

      - name: Build
        working-directory: backend
        # Warnings are errors (see Directory.Build.props), so this is the lint step too.
        run: dotnet build TripsAgent.slnx --no-restore --configuration Release

      - name: Test
        working-directory: backend
        # The integration tests start PostgreSQL through Testcontainers, which uses the Docker
        # daemon that ubuntu-latest already provides.
        run: dotnet test TripsAgent.slnx --no-build --configuration Release --verbosity normal

  migration-drift:
    name: migrations match the model
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore the pinned dotnet-ef tool
        working-directory: backend
        run: dotnet tool restore

      # `dotnet ef` builds the project to read the model, so the packages have to be restored
      # too. Without this the check fails with NETSDK1004 long before it looks at a migration.
      - name: Restore
        working-directory: backend
        run: dotnet restore TripsAgent.slnx

      - name: Check for a model change with no migration
        # An entity edited without `./scripts/ef.sh add <Name>` builds and tests perfectly well,
        # and then fails on deploy against a schema that never grew the column. Catch it here.
        run: ./scripts/ef.sh check
