# =============================================================================
#  Load-test infrastructure (issue 109). Read README.md in this folder first.
# =============================================================================
#
#  A stack of its own, apart from the development one in the repository root:
#  its own project name, its own volumes and its own ports. A load test writes
#  tens of thousands of search rows and fills Redis, and none of that should land
#  in the database you develop against. Both stacks can run at the same time.
#
#    docker compose -f backend/tests/load/docker-compose.yml up -d --wait
#    docker compose -f backend/tests/load/docker-compose.yml down -v   # wipe it
#
#  The supplier is WireMock, never Trips Africa: they publish no rate limits and
#  no concurrency ceiling (open question 27), so peak load against their staging
#  would be an incident, not a test.
#
#  Nothing here is safe outside your machine. Throwaway credentials, localhost
#  ports only.
# =============================================================================

name: trips-loadtest

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trips_loadtest
      POSTGRES_USER: trips
      POSTGRES_PASSWORD: trips_loadtest_only
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    # The PostgreSQL default, stated so the report can name it: the API's Npgsql
    # pool (100 by default) and Hangfire share these.
    command: ["postgres", "-c", "max_connections=100"]
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - loadtest-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trips -d trips_loadtest"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # No persistence: a cold run must start from an empty cache.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: trips
      RABBITMQ_DEFAULT_PASS: trips_loadtest_only
    ports:
      - "127.0.0.1:55672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  # The Trips Africa stand-in: recorded response shapes, and a log-normal delay
  # per call so the latency looks like a real flight search rather than a
  # loopback. See wiremock/mappings for the numbers.
  supplier-stub:
    image: wiremock/wiremock:3.13.1
    command: ["--port", "8080", "--no-request-journal", "--async-response-enabled=true", "--async-response-threads=200", "--container-threads=400"]
    ports:
      - "127.0.0.1:58089:8080"
    volumes:
      - ./wiremock:/home/wiremock:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/__admin/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  loadtest-postgres:
